<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrx - Premium Financial Hub</title>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --primary-green: #10b981;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            justify-content: center;
        }

        /* Authentication Screen Style */
        .auth-screen {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
            text-align: center;
            animation: fadeInUp 0.6s ease forwards;
        }

        .auth-screen h2 {
            color: var(--primary-green);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .auth-screen p {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 25px;
        }

        .input-field {
            width: 100%;
            background: var(--bg-dark);
            border: 1px solid #2d3a54;
            border-radius: 12px;
            color: var(--text-light);
            padding: 14px;
            font-size: 1rem;
            margin-bottom: 15px;
            box-sizing: border-box;
            outline: none;
        }

        .input-field:focus {
            border-color: var(--primary-green);
        }

        .auth-btn {
            width: 100%;
            background: var(--primary-green);
            color: var(--bg-dark);
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            margin-bottom: 15px;
        }

        .toggle-link {
            color: var(--primary-green);
            cursor: pointer;
            font-size: 0.9rem;
            text-decoration: none;
        }

        /* Main App Container */
        .app-container {
            display: none;
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
            animation: fadeInUp 0.6s ease forwards;
        }

        .header h1 {
            color: var(--primary-green);
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: var(--bg-dark);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 2px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            text-align: center;
        }

        .tab-btn.active { background: var(--primary-green); color: var(--bg-dark); }
        .calc-panel { display: none; }
        .calc-panel.active { display: block; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--primary-green); }
        input[type="number"] {
            width: 95px; background: var(--bg-dark); border: 1px solid #2d3a54;
            border-radius: 8px; color: var(--text-light); padding: 8px; text-align: center; font-size: 0.9rem;
        }

        .results-box { background: var(--bg-dark); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .result-item span:last-child { color: var(--primary-green); font-weight: bold; }

        .share-btn {
            width: 100%; background: var(--primary-green); color: var(--bg-dark); border: none;
            padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 15px; transition: 0.2s;
        }

        /* Calculator Style */
        .calc-screen {
            width: 100%; height: 65px; background: var(--bg-dark); border: 2px solid var(--primary-green);
            border-radius: 12px; margin-bottom: 15px; color: var(--primary-green); font-size: 2rem;
            text-align: right; padding: 15px; box-sizing: border-box;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .grid-btn { height: 55px; border-radius: 12px; border: none; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
        .btn-num { background: #1f293d; color: var(--text-light); }
        .btn-op { background: #2d3a54; color: var(--primary-green); }
        .btn-clr { background: #ef4444; color: white; }
        .btn-eq { background: var(--primary-green); color: var(--bg-dark); grid-column: span 2; }

        /* GST Style */
        .gst-btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
        .gst-calc-btn {
            background: #2d3a54; color: var(--primary-green); border: none; padding: 12px 5px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        .gst-calc-btn.active { background: var(--primary-green); color: var(--bg-dark); }
    </style>
</head>
<body>

<!-- Login Card -->
<div id="loginCard" class="auth-screen">
    <h2>Login to FinCrx</h2>
    <p>Enter your credentials to continue</p>
    <input type="text" placeholder="Mobile Number or Email ID" class="input-field" id="lName">
    <input type="password" placeholder="Password" class="input-field" id="lPass">
    <button class="auth-btn" onclick="handleLogin()">Login</button>
    <div>Don't have an account? <span class="toggle-link" onclick="toggleAuth('signup')">Sign Up</span></div>
</div>

<!-- Signup Card -->
<div id="signupCard" class="auth-screen" style="display: none;">
    <h2>Create Account</h2>
    <p>Sign up to start managing finances</p>
    <input type="text" placeholder="Full Name" class="input-field" id="sName">
    <input type="text" placeholder="Mobile Number" class="input-field" id="sPhone">
    <input type="email" placeholder="Email ID" class="input-field" id="sEmail">
    <input type="password" placeholder="Create Password" class="input-field" id="sPass">
    <button class="auth-btn" onclick="handleSignup()">Sign Up</button>
    <div>Already have an account? <span class="toggle-link" onclick="toggleAuth('login')">Login</span></div>
</div>

<!-- Main App Container -->
<div id="appCard" class="app-container">
    <div class="header">
        <h1>FinCrx Hub</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('sip')">SIP</button>
        <button class="tab-btn" onclick="switchTab('emi')">EMI</button>
        <button class="tab-btn" onclick="switchTab('gst')">GST</button>
        <button class="tab-btn" onclick="switchTab('calc')">Calculator</button>
    </div>

    <!-- SIP Panel -->
    <div id="sip-panel" class="calc-panel active">
        <div class="input-group">
            <label>Monthly Investment (₹)</label>
            <div class="input-row">
                <input type="range" id="sip-amt-slide" min="500" max="100000" step="500" value="5000" oninput="syncInput('sip-amt'); updateSIP();">
                <input type="number" id="sip-amt-num" value="5000" oninput="syncInput('sip-amt'); updateSIP();">
            </div>
        </div>
        <div class="input-group">
            <label>Expected Return (Annual %)</label>
            <div class="input-row">
                <input type="range" id="sip-rate-slide" min="1" max="30" step="0.5" value="12" oninput="syncInput('sip-rate'); updateSIP();">
                <input type="number" id="sip-rate-num" value="12" oninput="syncInput('sip-rate'); updateSIP();">
            </div>
        </div>
        <div class="input-group">
            <label>Time Period (Years)</label>
            <div class="input-row">
                <input type="range" id="sip-time-slide" min="1" max="40" step="1" value="10" oninput="syncInput('sip-time'); updateSIP();">
                <input type="number" id="sip-time-num" value="10" oninput="syncInput('sip-time'); updateSIP();">
            </div>
        </div>
        <div class="results-box">
            <div class="result-item"><span>Total Investment:</span><span id="sip-invested">₹0</span></div>
            <div class="result-item"><span>Estimated Returns:</span><span id="sip-gain">₹0</span></div>
            <div class="result-item"><span>Total Value:</span><span id="sip-total">₹0</span></div>
        </div>
        <button class="share-btn" onclick="shareReport('SIP')">Share Report</button>
    </div>

    <!-- EMI Panel -->
    <div id="emi-panel" class="calc-panel">
