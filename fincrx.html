<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinCrx - Premium Financial Hub</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        :root {
            --bg-dark: #0b0f19;
            --card-bg: #151d30;
            --primary-green: #10b981;
            --text-light: #ffffff;
            --text-muted: #94a3b8;
        }

        /* स्मूथ लॉन्च एनिमेशन */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .app-container {
            width: 100%;
            max-width: 450px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 20px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.6);
            box-sizing: border-box;
            animation: fadeInUp 0.8s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        .header h1 {
            color: var(--primary-green);
            text-align: center;
            margin: 0 0 20px 0;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        .tabs {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
            background: var(--bg-dark);
            padding: 5px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 10px 2px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: 0.3s;
            text-align: center;
        }

        .tab-btn.active { background: var(--primary-green); color: var(--bg-dark); }
        .calc-panel { display: none; }
        .calc-panel.active { display: block; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 0.9rem; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        input[type="range"] { flex: 1; accent-color: var(--primary-green); }
        input[type="number"] {
            width: 95px; background: var(--bg-dark); border: 1px solid #2d3a54;
            border-radius: 8px; color: var(--text-light); padding: 8px; text-align: center; font-size: 0.9rem;
        }

        .results-box { background: var(--bg-dark); border-radius: 12px; padding: 15px; margin-top: 15px; }
        .result-item { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 0.95rem; }
        .result-item span:last-child { color: var(--primary-green); font-weight: bold; }
        .chart-container { position: relative; margin: 20px auto; height: 200px; width: 200px; }

        .share-btn {
            width: 100%; background: var(--primary-green); color: var(--bg-dark); border: none;
            padding: 12px; border-radius: 12px; font-size: 1rem; font-weight: bold; cursor: pointer;
            margin-top: 15px; transition: 0.2s;
        }
        .share-btn:active { transform: scale(0.98); }

        /* जनरल कैलकुलेटर स्टाइल */
        .calc-screen {
            width: 100%; height: 65px; background: var(--bg-dark); border: 2px solid var(--primary-green);
            border-radius: 12px; margin-bottom: 15px; color: var(--primary-green); font-size: 2rem;
            text-align: right; padding: 15px; box-sizing: border-box;
        }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .grid-btn { height: 55px; border-radius: 12px; border: none; font-size: 1.3rem; font-weight: bold; cursor: pointer; }
        .btn-num { background: #1f293d; color: var(--text-light); }
        .btn-op { background: #2d3a54; color: var(--primary-green); }
        .btn-clr { background: #ef4444; color: white; }
        .btn-eq { background: var(--primary-green); color: var(--bg-dark); grid-column: span 2; }

        /* GST स्टाइल */
        .gst-btn-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0; }
        .gst-calc-btn {
            background: #2d3a54; color: var(--primary-green); border: none; padding: 12px 5px;
            border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem;
        }
        .gst-calc-btn.active { background: var(--primary-green); color: var(--bg-dark); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>FinCrx Hub</h1>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('sip')">SIP</button>
        <button class="tab-btn" onclick="switchTab('emi')">EMI</button>
        <button class="tab-btn" onclick="switchTab('gst')">GST</button>
        <button class="tab-btn" onclick="switchTab('calc')">कैलकुलेटर</button>
    </div>

    <!-- 1. SIP पैनल -->
    <div id="sip-panel" class="calc-panel active">
        <div class="input-group">
            <label>मासिक निवेश (₹)</label>
            <div class="input-row">
                <input type="range" id="sip-amt-slide" min="500" max="100000" step="500" value="5000" oninput="syncInput('sip-amt'); updateSIP();">
                <input type="number" id="sip-amt-num" value="5000" oninput="syncInput('sip-amt'); updateSIP();">
            </div>
        </div>
        <div class="input-group">
            <label>अपेक्षित रिटर्न (वार्षिक %)</label>
            <div class="input-row">
                <input type="range" id="sip-rate-slide" min="1" max="30" step="0.5" value="12" oninput="syncInput('sip-rate'); updateSIP();">
                <input type="number" id="sip-rate-num" value="12" oninput="syncInput('sip-rate'); updateSIP();">
            </div>
        </div>
        <div class="input-group">
            <label>समय अवधि (वर्ष)</label>
            <div class="input-row">
                <input type="range" id="sip-time-slide" min="1" max="40" step="1" value="10" oninput="syncInput('sip-time'); updateSIP();">
                <input type="number" id="sip-time-num" value="10" oninput="syncInput('sip-time'); updateSIP();">
            </div>
        </div>
        <div class="results-box">
            <div class="result-item"><span>कुल निवेश:</span><span id="sip-invested">₹0</span></div>
            <div class="result-item"><span>अनुमानित रिटर्न:</span><span id="sip-gain">₹0</span></div>
            <div class="result-item"><span>कुल वैल्यू:</span><span id="sip-total">₹0</span></div>
        </div>
        <div class="chart-container"><canvas id="sipChart"></canvas></div>
        <button class="share-btn" onclick="shareReport('SIP')">Share Report</button>
    </div>

    <!-- 2. EMI पैनल -->
    <div id="emi-panel" class="calc-panel">
        <div class="input-group">
            <label>लोन राशि (₹)</label>
            <div class="input-row">
                <input type="range" id="emi-amt-slide" min="10000" max="10000000" step="10000" value="500000" oninput="syncInput('emi-amt'); updateEMI();">
                <input type="number" id="emi-amt-num" value="500000" oninput="syncInput('emi-amt'); updateEMI();">
            </div>
        </div>
        <div class="input-group">
            <label>ब्याज दर (वार्षिक %)</label>
            <div class="input-row">
                <input type="range" id="emi-rate-slide" min="1" max="20" step="0.1" value="8.5" oninput="syncInput('emi-rate'); updateEMI();">
                <input type="number" id="emi-rate-num" value="8.5" oninput="syncInput('emi-rate'); updateEMI();">
            </div>
        </div>
        <div class="input-group">
            <label>अवधि (महीने)</label>
            <div class="input-row">
                <input type="range" id="emi-time-slide" min="6" max="360" step="6" value="60" oninput="syncInput('emi-time'); updateEMI();">
                <input type="number" id="emi-time-num" value="60" oninput="syncInput('emi-time'); updateEMI();">
            </div>
        </div>
        <div class="results-box">
            <div class="result-item"><span>मासिक EMI:</span><span id="emi-monthly">₹0</span></div>
            <div class="result-item"><span>कुल ब्याज:</span><span id="emi-interest">₹0</span></div>
            <div class="result-item"><span>कुल भुगतान:</span><span id="emi-total">₹0</span></div>
        </div>
        <button class="share-btn" onclick="shareReport('EMI')">Share Report</button>
    </div>

    <!-- 3. GST पैनल -->
    <div id="gst-panel" class="calc-panel">
        <div class="input-group">
            <label>मूल राशि (₹)</label>
            <input type="number" id="gst-amount" value="1000" style="width:100%; text-align:left; box-sizing: border-box;" oninput="calculateGST()">
        </div>
        <label style="color:var(--text-muted); font-size:0.9rem;">GST दर चुनें:</label>
        <div class="gst-btn-row">
            <button class="gst-calc-btn" id="gst-5" onclick="changeGSTRate(5)">5%</button>
            <button class="gst-calc-btn" id="gst-12" onclick="changeGSTRate(12)">12%</button>
            <button class="gst-calc-btn active" id="gst-18" onclick="changeGSTRate(18)">18%</button>
            <button class="gst-calc-btn" id="gst-28" onclick="changeGSTRate(28)">28%</button>
        </div>
        <div class="results-box">
            <div class="result-item"><span>चुनी गई GST दर:</span><span id="gst-rate-show">18%</span></div>
