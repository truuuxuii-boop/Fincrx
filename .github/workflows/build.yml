name: Build APK
on: [push, workflow_dispatch]
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g cordova
      - run: |
          cordova create myapp com.example.fincrx FincrxApp
          cd myapp
          cordova platform add android --confirm=false
          rm -rf www/*
          cp ../fincrx.html www/index.html
          cordova build android --release --confirm=false
      - name: Find and Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: myapp/**/*.apk
          
