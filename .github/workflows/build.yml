name: Build APK
on: [push, workflow_dispatch]
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g cordova
      - run: |
          cordova create myapp com.example.fincrx FincrxApp
          cd myapp
          cordova platform add android --confirm=false
          
          # HTML फाइल कॉपी करें
          rm -rf www/*
          cp ../fincrx.html www/index.html
          
          # आइकन सेटअप
          mkdir -p res
          cp ../icon.png res/icon.png
          
          # config.xml आइकन रजिस्ट्रेशन
          sed -i '/<\/widget>/i \    <icon src="res/icon.png" />' config.xml
          sed -i '/<\/widget>/i \    <preference name="AndroidWindowSplashScreenAnimatedIcon" value="res/icon.png" />' config.xml
          
          cordova build android --confirm=false
      - name: Find All Android Packages
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/*.apk
            **/*.aab
            
