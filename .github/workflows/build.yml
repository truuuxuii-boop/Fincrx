name: Build APK
on: [push, workflow_dispatch]
jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install -g cordova
      - run: |
          cordova create myapp com.example.fincrx FincrxApp
          cd myapp
          cordova platform add android --confirm=false
          
          # यहाँ असली सुधार है - फ़ाइल का ओरिजिनल नाम बनाए रखा गया है
          rm -rf www/*
          cp ../fincrx.html www/fincrx.html
          
          # कॉर्डोवा को बताएं कि मुख्य फ़ाइल fincrx.html है
          sed -i 's/src="index.html"/src="fincrx.html"/' config.xml
          
          # सुरक्षा ताला खोलने की अनुमति
          sed -i '/<\/widget>/i \    <access origin="*" />' config.xml
          sed -i '/<\/widget>/i \    <allow-intent href="http://*/*" />' config.xml
          sed -i '/<\/widget>/i \    <allow-intent href="https://*/*" />' config.xml
          
          cordova build android --confirm=false
      - name: Find All Android Packages
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: |
            **/*.apk
            **/*.aab
            
